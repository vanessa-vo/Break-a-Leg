<script>
  const calorieTarget = 400;
  const proteinTarget = 30;

  const basePorridge = {
    name: "Shrimp Porridge",
    calories: 280,
    protein: 30,
    ingredient: "1 container of pre-made shrimp porridge"
  };

  const toppings = [
    {
      id: "caramelizedFish",
      name: "Caramelized Fish",
      serving: "1 serving",
      amountPerServing: 1,
      unit: "serving",
      calories: 85,
      protein: 10,
      max: 1
    },
    {
      id: "saltedDuckEgg",
      name: "Salted Duck Egg",
      serving: "1/2 egg",
      amountPerServing: 0.5,
      unit: "egg",
      calories: 50,
      protein: 4,
      max: 2
    },
    {
      id: "centuryEgg",
      name: "Century Egg",
      serving: "1/2 egg",
      amountPerServing: 0.5,
      unit: "egg",
      calories: 40,
      protein: 4,
      max: 2
    },
    {
      id: "friedGarlic",
      name: "Fried Garlic",
      serving: "2 g",
      amountPerServing: 2,
      unit: "g",
      calories: 10,
      protein: 0,
      max: 2
    },
    {
      id: "friedShallots",
      name: "Fried Shallots",
      serving: "2 g",
      amountPerServing: 2,
      unit: "g",
      calories: 15,
      protein: 0,
      max: 2
    },
    {
      id: "beanSprouts",
      name: "Bean Sprouts",
      serving: "50 g",
      amountPerServing: 50,
      unit: "g",
      calories: 15,
      protein: 1.5,
      max: 2
    },
    {
      id: "cilantro",
      name: "Cilantro",
      serving: "2 branches",
      amountPerServing: 2,
      unit: "branch",
      calories: 0,
      protein: 0,
      max: null
    },
    {
      id: "greenOnion",
      name: "Green Onion",
      serving: "1 branch",
      amountPerServing: 1,
      unit: "branch",
      calories: 0,
      protein: 0,
      max: null
    }
  ];

  const quantities = {};

  toppings.forEach((topping) => {
    quantities[topping.id] = 0;
  });

  const toppingsContainer = document.getElementById("toppingsContainer");

  toppings.forEach((topping) => {
    const card = document.createElement("div");
    card.className = "topping";

    card.innerHTML = `
      <div class="topping-info">
        <div class="topping-name">${topping.name}</div>
        <div class="serving-info">1 serving = ${topping.serving}</div>
        <div class="topping-macros">${topping.calories} cal • ${topping.protein} g protein</div>
      </div>

      <div class="quantity-control">
        <button
          class="quantity-button minus-button"
          type="button"
          aria-label="Remove one serving"
        >
          −
        </button>

        <span class="quantity-number">0</span>

        <button
          class="quantity-button plus-button"
          type="button"
          aria-label="Add one serving"
        >
          +
        </button>
      </div>
    `;

    const minusButton = card.querySelector(".minus-button");
    const plusButton = card.querySelector(".plus-button");
    const quantityNumber = card.querySelector(".quantity-number");

    minusButton.disabled = true;

    minusButton.addEventListener("click", () =>
      changeQuantity(
        topping,
        -1,
        minusButton,
        plusButton,
        quantityNumber
      )
    );

    plusButton.addEventListener("click", () =>
      changeQuantity(
        topping,
        1,
        minusButton,
        plusButton,
        quantityNumber
      )
    );

    topping.card = card;
    topping.minusButton = minusButton;
    topping.plusButton = plusButton;
    topping.quantityNumber = quantityNumber;

    toppingsContainer.appendChild(card);
  });

  function changeQuantity(
    topping,
    change,
    minusButton,
    plusButton,
    quantityNumber
  ) {
    let next = quantities[topping.id] + change;

    if (next < 0) next = 0;

    if (
      topping.max !== null &&
      next > topping.max
    ) {
      next = topping.max;
    }

    quantities[topping.id] = next;

    quantityNumber.textContent = String(next);

    minusButton.disabled = next === 0;

    plusButton.disabled =
      topping.max !== null &&
      next >= topping.max;

    updateMacros();
  }

  function getQuantity(id) {
    return quantities[id] || 0;
  }

  function calculateMacros() {
    let calories = basePorridge.calories;
    let protein = basePorridge.protein;

    toppings.forEach((topping) => {
      const quantity = getQuantity(topping.id);

      calories += topping.calories * quantity;
      protein += topping.protein * quantity;
    });

    return {
      calories,
      protein
    };
  }

  function setMacroStatus(
    statusElement,
    macros
  ) {
    const caloriesOkay =
      macros.calories <= calorieTarget;

    const proteinOkay =
      macros.protein >= proteinTarget;

    if (
      caloriesOkay &&
      proteinOkay
    ) {
      statusElement.className =
        "macro-status good";

      statusElement.textContent =
        "✓ Within your target range";

      return;
    }

    statusElement.className =
      "macro-status warning";

    if (
      !caloriesOkay &&
      proteinOkay
    ) {
      statusElement.textContent =
        `Calories are above your ${calorieTarget} kcal target.`;
    } else if (
      caloriesOkay &&
      !proteinOkay
    ) {
      statusElement.textContent =
        `Protein is below your ${proteinTarget} g target.`;
    } else {
      statusElement.textContent =
        `Calories are above ${calorieTarget} kcal and protein is below ${proteinTarget} g.`;
    }
  }

  function updateMacros() {
    const macros = calculateMacros();

    document.getElementById(
      "liveCalories"
    ).textContent =
      String(macros.calories);

    document.getElementById(
      "liveProtein"
    ).textContent =
      macros.protein.toFixed(1);

    setMacroStatus(
      document.getElementById(
        "macroStatus"
      ),
      macros
    );
  }

  function getTotalAmount(
    topping,
    quantity
  ) {
    const total =
      topping.amountPerServing *
      quantity;

    if (
      topping.unit === "egg"
    ) {
      if (total === 0.5) {
        return "1/2 egg";
      }

      if (total === 1) {
        return "1 egg";
      }

      return `${total} eggs`;
    }

    if (
      topping.unit === "branch"
    ) {
      if (total === 1) {
        return "1 branch";
      }

      return `${total} branches`;
    }

    if (
      topping.unit === "g"
    ) {
      return `${total} g`;
    }

    if (
      topping.unit === "serving"
    ) {
      if (total === 1) {
        return "1 serving";
      }

      return `${total} servings`;
    }

    return String(total);
  }

  function addListItem(
    listId,
    text
  ) {
    const item =
      document.createElement("li");

    item.textContent = text;

    document
      .getElementById(listId)
      .appendChild(item);
  }

  function buildPorridge() {
    const ingredientList =
      document.getElementById(
        "ingredientList"
      );

    const instructionList =
      document.getElementById(
        "instructionList"
      );

    ingredientList.innerHTML = "";
    instructionList.innerHTML = "";

    const macros =
      calculateMacros();

    document.getElementById(
      "finalCalories"
    ).textContent =
      String(macros.calories);

    document.getElementById(
      "finalProtein"
    ).textContent =
      macros.protein.toFixed(1);

    setMacroStatus(
      document.getElementById(
        "finalMacroStatus"
      ),
      macros
    );

    addListItem(
      "ingredientList",
      basePorridge.ingredient
    );

    toppings.forEach(
      (topping) => {
        const quantity =
          getQuantity(
            topping.id
          );

        if (quantity > 0) {
          addListItem(
            "ingredientList",
            `${topping.name}: ${getTotalAmount(
              topping,
              quantity
            )}`
          );
        }
      }
    );

    const beanSprouts =
      getQuantity(
        "beanSprouts"
      );

    const greenOnionServings =
      getQuantity(
        "greenOnion"
      );

    if (
      beanSprouts > 0
    ) {
      addListItem(
        "instructionList",
        `Blanch ${beanSprouts * 50} g of bean sprouts first.`
      );

      addListItem(
        "instructionList",
        "Place the blanched bean sprouts at the bottom of your serving bowl."
      );
    }

    if (
      greenOnionServings > 0
    ) {
      const branches =
        greenOnionServings;

      addListItem(
        "instructionList",
        `Cut ${
          branches === 1
            ? "1 branch"
            : `${branches} branches`
        } of green onion into small pieces, then place it in the serving bowl.`
      );
    }

    addListItem(
      "instructionList",
      "Place the pre-made shrimp porridge in a pot and heat it."
    );

    addListItem(
      "instructionList",
      "Add approximately 250–350 ml of water."
    );

    addListItem(
      "instructionList",
      "Stir while heating until the porridge is hot and reaches your preferred consistency."
    );

    if (
      beanSprouts > 0 ||
      greenOnionServings > 0
    ) {
      addListItem(
        "instructionList",
        "Pour the heated porridge over the ingredients in the serving bowl."
      );
    } else {
      addListItem(
        "instructionList",
        "Pour the heated porridge into your serving bowl."
      );
    }

    if (
      getQuantity(
        "caramelizedFish"
      ) > 0
    ) {
      addListItem(
        "instructionList",
        "Microwave 1 serving of caramelized fish for approximately 1–2 minutes, then place it on top of the porridge."
      );
    }

    const saltedEgg =
      getQuantity(
        "saltedDuckEgg"
      );

    if (
      saltedEgg === 1
    ) {
      addListItem(
        "instructionList",
        "Peel the salted duck egg, cut it in half, and place 1 half on top of the porridge."
      );
    } else if (
      saltedEgg === 2
    ) {
      addListItem(
        "instructionList",
        "Peel the salted duck egg, cut it in half, and place both halves on top of the porridge."
      );
    }

    const centuryEgg =
      getQuantity(
        "centuryEgg"
      );

    if (
      centuryEgg === 1
    ) {
      addListItem(
        "instructionList",
        "Peel the century egg, cut it in half, and place 1 half on top of the porridge."
      );
    } else if (
      centuryEgg === 2
    ) {
      addListItem(
        "instructionList",
        "Peel the century egg, cut it in half, and place both halves on top of the porridge."
      );
    }

    const cilantroServings =
      getQuantity(
        "cilantro"
      );

    if (
      cilantroServings > 0
    ) {
      const branches =
        cilantroServings * 2;

      addListItem(
        "instructionList",
        `Cut ${
          branches === 1
            ? "1 branch"
            : `${branches} branches`
        } of cilantro into small pieces, then sprinkle on top of the porridge.`
      );
    }

    const shallots =
      getQuantity(
        "friedShallots"
      );

    if (
      shallots > 0
    ) {
      addListItem(
        "instructionList",
        `Sprinkle ${shallots * 2} g of fried shallots on top.`
      );
    }

    const garlic =
      getQuantity(
        "friedGarlic"
      );

    if (
      garlic > 0
    ) {
      addListItem(
        "instructionList",
        `Sprinkle ${garlic * 2} g of fried garlic on top.`
      );
    }

    document.getElementById(
      "selectionPage"
    ).style.display =
      "none";

    document.getElementById(
      "resultPage"
    ).style.display =
      "block";

    window.scrollTo(
      0,
      0
    );
  }

  function startOver() {
    toppings.forEach(
      (topping) => {
        quantities[topping.id] =
          0;

        topping.quantityNumber.textContent =
          "0";

        topping.minusButton.disabled =
          true;

        topping.plusButton.disabled =
          false;
      }
    );

    updateMacros();

    document.getElementById(
      "resultPage"
    ).style.display =
      "none";

    document.getElementById(
      "selectionPage"
    ).style.display =
      "block";

    window.scrollTo(
      0,
      0
    );
  }

  document
    .getElementById(
      "buildButton"
    )
    .addEventListener(
      "click",
      buildPorridge
    );

  document
    .getElementById(
      "startOverButton"
    )
    .addEventListener(
      "click",
      startOver
    );

  updateMacros();
</script>
